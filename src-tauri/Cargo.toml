[package]
name = "mochi"
version = "0.1.0"
description = "Mochi game launcher"
authors = ["Mochi contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
url = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
gilrs = "0.11.2"
# Reads macOS Info.plist / Whisky metadata; platform-neutral so the parsers are tested on Linux too.
plist = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

# Release builds: smaller binary, no behaviour change (panics still unwind, so a panicking
# task cannot take the whole app down).
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
