name: Mochi CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Detect backend changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.ref }}
          filters: |
            backend:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'

  curseforge-proxy-tests:
    name: CurseForge proxy tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Test CurseForge proxy
        run: deno test --allow-env supabase/functions/curseforge-proxy/

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Linux dependencies
        run: |
          sudo sed -i             -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g'             -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g'             /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev             libayatana-appindicator3-dev             librsvg2-dev             patchelf             libudev-dev
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (2026-10-09)
        with:
          components: clippy
      - name: Cache Rust
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install dependencies
        run: npm ci
      - name: Build frontend (includes theme validation)
        run: npm run build
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm test
      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Lint Tauri backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Test Tauri backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

  macos:
    name: macOS backend (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (2026-10-09)
        with:
          components: clippy
      - name: Cache Rust
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: macos-${{ matrix.os }}-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare Tauri frontend directory
        run: mkdir -p dist
      - name: Check Tauri backend
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Lint Tauri backend
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo clippy --manifest-path src-tauri/Cargo.toml
      - name: Test Tauri backend
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo test --manifest-path src-tauri/Cargo.toml
