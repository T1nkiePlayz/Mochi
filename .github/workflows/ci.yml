name: Mochi CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Detect backend changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.ref }}
          filters: |
            backend:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'

  curseforge-proxy-tests:
    name: CurseForge proxy tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Test CurseForge proxy
        run: deno test --allow-env supabase/functions/curseforge-proxy/

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend (includes theme validation)
        run: npm run build
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm test

  # Rust on Linux only runs when the backend changed (the backend does not read anything outside src-tauri).
  build:
    name: build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The downloaded .deb files are kept in the Actions cache, so apt only fetches the package index from the
      # Ubuntu mirror (which is sometimes very slow) and installs from local files.
      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: apt-ubuntu-24.04-webkit-v1
      - name: Install Linux dependencies
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Dir::Cache::Archives="$HOME/apt-cache" \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev
          sudo rm -rf ~/apt-cache/partial ~/apt-cache/lock
          sudo chown -R "$USER" ~/apt-cache
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (2026-10-09)
        with:
          components: clippy
      - name: Cache Rust
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          # PR caches are 1 GB+ each and only ever reused by the same PR; main's cache serves every PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare Tauri frontend directory
        run: mkdir -p dist
      # Clippy performs the same type check as `cargo check`, so a separate check step is not needed.
      - name: Lint Tauri backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Test Tauri backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

  macos:
    name: macOS backend (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (2026-10-09)
        with:
          components: clippy
      - name: Cache Rust
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: macos-${{ matrix.os }}-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare Tauri frontend directory
        run: mkdir -p dist
      - name: Lint Tauri backend
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo clippy --manifest-path src-tauri/Cargo.toml
      - name: Test Tauri backend
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo test --manifest-path src-tauri/Cargo.toml
