name: Release Mochi

# Push a tag such as v0.2.0 to build and publish a release. Run it by hand
# (Actions > Release Mochi > Run workflow) to rebuild an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Sync app version from tag
        run: node scripts/sync-version.mjs "$TAG"

      - name: Commit the synced version to main (best effort)
        run: |
          git fetch origin main
          if git diff --quiet -- package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml; then
            echo "Version metadata is already synced."
          elif [[ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]]; then
            echo "::warning::Tag is not the tip of main; builds still use the tag's version, but main was not updated."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
            git commit -m "chore: sync app version to ${TAG#v}"
            git push origin HEAD:main || echo "::warning::Could not push the version commit (protected branch?). Builds are unaffected."
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          {
            echo "## Mochi $TAG"
            echo
            echo "Your games, your way."
            echo
            echo "### Downloads"
            echo "- **macOS**: \`.dmg\` (universal: Apple silicon and Intel)"
            echo "- **Linux**: \`.AppImage\`, \`.deb\`, \`.rpm\`"
            echo "- \`SHA256SUMS.txt\` lists a checksum for every file."
            if [[ "$HAS_GPG" == "true" ]]; then
              echo "- Every file has a GPG signature (\`.asc\`) and a GitHub build attestation. See *Verify your download* in the README."
            else
              echo "- Every file has a GitHub build attestation. See *Verify your download* in the README."
            fi
            if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_ID" ]]; then
              echo
              echo "### macOS note: this build is not notarized"
              echo "This macOS build is ad-hoc signed, not signed with an Apple Developer ID, so Gatekeeper will warn about it the first time:"
              echo "1. Drag **Mochi** to *Applications*."
              echo "2. **Right-click Mochi, choose Open**, then click **Open** in the dialog (a double click only shows a warning)."
              echo "3. If macOS says the app is damaged, run \`xattr -dr com.apple.quarantine /Applications/Mochi.app\` in Terminal and open it again."
              echo
              echo "Automatic updates inside Mochi keep working; only the first launch needs these steps."
            fi
          } > notes.md
          flags=(--draft --title "Mochi $TAG" --notes-file notes.md --verify-tag)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"

  linux:
    name: Linux packages
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Sync app version from tag
        run: node scripts/sync-version.mjs "$TAG"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Decide whether to build updater artifacts
        id: updater
        run: |
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > "$RUNNER_TEMP/with-updater.json"
            echo "args=--config $RUNNER_TEMP/with-updater.json" >> "$GITHUB_OUTPUT"; echo "json=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts."
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
            echo "args=--config $RUNNER_TEMP/no-updater.json" >> "$GITHUB_OUTPUT"; echo "json=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and upload packages
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseDraft: true
          includeUpdaterJson: ${{ steps.updater.outputs.json == 'true' }}
          args: ${{ steps.updater.outputs.args }}

  macos:
    # One universal build (arm64 + x86_64) so a single DMG and a single updater entry cover both.
    # Runs after the Linux job so the two never overwrite each other's latest.json.
    # Without the Apple secrets it still succeeds: the app is ad-hoc signed ("-") and unnotarized.
    name: macOS universal DMG
    needs: [prepare, linux]
    runs-on: macos-14
    permissions:
      contents: write
    env:
      APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Sync app version from tag
        run: node scripts/sync-version.mjs "$TAG"

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: release-universal

      - run: npm ci

      - name: Configure signing
        id: signing
        run: |
          # Empty secrets must not reach the bundler as empty variables, so export only what is set.
          if [[ -n "$APPLE_CERTIFICATE_SECRET" && -n "$APPLE_SIGNING_IDENTITY_SECRET" && -n "$APPLE_CERTIFICATE_PASSWORD_SECRET" ]]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_SECRET"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_SECRET"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            if [[ -n "$APPLE_ID_SECRET" && -n "$APPLE_PASSWORD_SECRET" && -n "$APPLE_TEAM_ID_SECRET" ]]; then
              {
                echo "APPLE_ID=$APPLE_ID_SECRET"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET"
              } >> "$GITHUB_ENV"
              echo "notarized=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Signing with Developer ID but APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID are missing: the app will not be notarized."
              echo "notarized=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::Apple signing secrets are not configured: building an ad-hoc signed, unnotarized DMG."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to build updater artifacts
        id: updater
        run: |
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "args=--target universal-apple-darwin" >> "$GITHUB_OUTPUT"; echo "json=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts."
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
            echo "args=--target universal-apple-darwin --config $RUNNER_TEMP/no-updater.json" >> "$GITHUB_OUTPUT"; echo "json=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, sign and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseDraft: true
          includeUpdaterJson: ${{ steps.updater.outputs.json == 'true' }}
          args: ${{ steps.updater.outputs.args }}

      - name: Verify the built app bundle
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          NOTARIZED: ${{ steps.signing.outputs.notarized }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/universal-apple-darwin/release/bundle"
          app="$bundle_dir/macos/Mochi.app"
          plist="$app/Contents/Info.plist"
          test -d "$app"
          expect() { # key expected
            actual="$(/usr/libexec/PlistBuddy -c "Print :$1" "$plist")"
            [[ "$actual" == "$2" ]] || { echo "::error::Info.plist $1 is '$actual', expected '$2'"; exit 1; }
          }
          expect CFBundleIdentifier dev.sidequestgames.Mochilauncher
          expect CFBundleShortVersionString "${TAG#v}"
          expect LSApplicationCategoryType public.app-category.games
          expect CFBundleURLTypes:0:CFBundleURLSchemes:0 mochi
          min="$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$plist")"
          echo "LSMinimumSystemVersion=$min"
          [[ -n "$min" ]]
          archs="$(lipo -archs "$app/Contents/MacOS/mochi")"
          echo "Architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Identifier|Signature|TeamIdentifier|flags" || true
          if [[ "$SIGNED" == "true" ]]; then
            codesign -dv "$app" 2>&1 | grep -q "Authority=Developer ID Application"
          fi
          if [[ "$NOTARIZED" == "true" ]]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          fi
          for dmg in "$bundle_dir"/dmg/*.dmg; do hdiutil verify "$dmg"; done

  publish:
    name: Checksums, signatures and publish
    needs: [prepare, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write      # lets GitHub issue the short-lived certificate for build attestations
      attestations: write  # stores the attestations for this repository
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      # Only the public key and the checkout of the tag are needed from the repository.
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: docs/release-signing-key.asc
          sparse-checkout-cone-mode: false

      - name: Download the release files and write SHA256SUMS.txt
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --pattern '*.dmg' --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm'
          ls -l
          [[ -n "$(ls -A)" ]] || { echo "::error::No release files were found to sign."; exit 1; }
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign with GPG
        run: |
          set -euo pipefail
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::warning::GPG_PRIVATE_KEY is not set: files are published without GPG signatures (build attestations are still created)."
            exit 0
          fi
          test -f docs/release-signing-key.asc || { echo "::error::docs/release-signing-key.asc (the public key) is missing from the repository."; exit 1; }

          # An isolated, throw-away keyring that only lives for this job.
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          secret_fpr="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          public_fpr="$(gpg --batch --show-keys --with-colons docs/release-signing-key.asc | awk -F: '/^fpr:/ {print $10; exit}')"
          echo "Signing key fingerprint: $secret_fpr"
          # Refuse to sign with any key other than the one published in the repository and README.
          [[ -n "$secret_fpr" && "$secret_fpr" == "$public_fpr" ]] || { echo "::error::The GPG_PRIVATE_KEY secret does not match docs/release-signing-key.asc."; exit 1; }

          cd assets
          for file in *; do
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$secret_fpr" --armor --detach-sign --output "$file.asc" -- "$file"
          done

          # Check every signature against the public key from the repository, exactly as a user would.
          verify_home="$(mktemp -d)"; chmod 700 "$verify_home"
          gpg --homedir "$verify_home" --batch --quiet --import ../docs/release-signing-key.asc
          for sig in *.asc; do gpg --homedir "$verify_home" --batch --verify "$sig" "${sig%.asc}"; done
          rm -rf "$verify_home"

      - name: Create build attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/*.dmg
            assets/*.AppImage
            assets/*.deb
            assets/*.rpm
            assets/SHA256SUMS.txt

      - name: Upload checksums and signatures
        run: |
          cd assets
          gh release upload "$TAG" SHA256SUMS.txt *.asc --clobber

      - name: Add copy-and-paste verification commands to the release notes
        run: |
          marker="<!-- verify-commands -->"
          gh release view "$TAG" --json body -q .body > notes.md
          if grep -qF "$marker" notes.md; then echo "Verification commands already present."; exit 0; fi
          {
            echo
            echo "$marker"
            echo "### Verify your download"
            echo
            echo "Files: $(cd assets && ls | grep -v '\.asc$' | grep -v '^SHA256SUMS.txt$' | sed 's/.*/`&`/' | paste -sd, - | sed 's/,/, /g')"
            echo
            echo '```bash'
            echo "# Checksums (put SHA256SUMS.txt next to your download; use shasum -a 256 on macOS)"
            echo "sha256sum -c --ignore-missing SHA256SUMS.txt"
            if ls assets/*.asc >/dev/null 2>&1; then
              echo
              echo "# GPG signature (key fingerprint: C735 859C E725 06BA 7BCD  C4F2 0F89 D3A3 E4B4 680F)"
              echo "curl -fsSL https://raw.githubusercontent.com/${GH_REPO}/main/docs/release-signing-key.asc | gpg --import"
              echo "gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt"
              for f in $(cd assets && ls | grep -v '\.asc$' | grep -v '^SHA256SUMS.txt$'); do echo "gpg --verify $f.asc $f"; done
            fi
            echo
            echo "# Build attestation"
            for f in $(cd assets && ls | grep -v '\.asc$' | grep -v '^SHA256SUMS.txt$'); do echo "gh attestation verify $f --repo ${GH_REPO}"; done
            echo '```'
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest=$([[ "$TAG" == *-* ]] && echo false || echo true)
