name: Release Mochi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release Linux packages
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release notes from tagged commit
        id: release_notes
        shell: bash
        run: |
          notes="$(git show -s --format='%b' "$GITHUB_SHA")"

          if [[ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]]; then
            notes="## Mochi $GITHUB_REF_NAME

Your games, your way.

### Linux downloads
- **AppImage** — portable Linux build
- **DEB** — Debian/Ubuntu-based distributions
- **RPM** — Fedora/RHEL-based distributions"
          fi

          {
            echo 'body<<MOCHI_RELEASE_NOTES'
            printf '%s\n' "$notes"
            echo 'MOCHI_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mochi ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
